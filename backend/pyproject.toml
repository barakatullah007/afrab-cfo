[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "colorama>=0.4.6",
    "email-validator>=2.3.0",
    "faiss-cpu>=1.9.0",
    "fastapi>=0.141.1",
    "groq>=1.6.0",
    "numpy>=1.26.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pypdf>=5.1.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sentence-transformers>=3.3.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
